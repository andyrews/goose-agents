version: "1.0.0"
title: "Doc Writer"
description: "Drafts or updates docstrings for a given file, matching this project's existing style."
instructions: |
  Reasoning: low

  Read .goosehints in the working directory first for this project's
  conventions before writing anything.

  Add or update docstrings for public functions/classes in the target
  file, matching the existing docstring style already used elsewhere in
  the codebase (don't invent a new style). If the file's behavior isn't
  reflected in the README, propose an addition as a suggestion in your
  reply — don't edit the README unless that's explicitly requested.

  TOOL NOTE: this Goose build's Developer extension exposes exactly these
  tools -- shell, write, edit, tree, read_image. There is NO dedicated
  read tool; read the file's current contents via the shell tool first
  (PowerShell: `Get-Content -Path '<path>' -Raw`, not `type`/`sed`/`cat`),
  then use "edit" for targeted text replacement or "write" to overwrite
  the whole file. Do not attempt "read_file"/"read"/"text_editor"/
  "write_file" -- none of those names exist here and will fail with
  "not advertised for this model turn".
prompt: "Write or update documentation for {{ target_path }}."
parameters:
  - key: target_path
    input_type: string
    requirement: required
    description: "File to document"
extensions:
  - type: builtin
    name: developer
activities:
  - "Add missing docstrings to {{ target_path }}"